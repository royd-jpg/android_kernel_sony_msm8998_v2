name: build-kernel

# Sony Xperia XZ1 SOV36 (poplar_kddi) - msm8998 (yoshino), Linux 4.4.302, arm64
# Builds ONLY: lineage-msm8998-yoshino-poplar_kddi_defconfig + msm8998-v2.1-yoshino-poplar_kddi.dtb
#
# Run:  gh workflow run build-kernel.yml --ref <branch that contains this file> \
#         -f branch=axion-a16-features
# (A workflow_dispatch workflow only appears in the Actions UI if the file is on the DEFAULT branch.)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Kernel source branch to build"
        required: true
        default: "axion-a16-features"
        type: string
      clang_url:
        description: "OPTIONAL full AOSP clang 20.x tarball URL. Empty = probe googlesource branches for clang_rev."
        required: false
        default: ""
        type: string
      clang_rev:
        description: "AOSP clang build id probed when clang_url is empty (r547379 = Clang 20.0.0)"
        required: true
        default: "r547379"
        type: string
      enable_ksu:
        description: "Apply the KSU+SUSFS(inline hook)+NoMount+BBG+Re:Kernel block that poplar_defconfig carries but poplar_kddi_defconfig lacks"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  DEFCONFIG: lineage-msm8998-yoshino-poplar_kddi_defconfig
  DTB_NAME: msm8998-v2.1-yoshino-poplar_kddi
  DTB_MACH_SYMBOL: CONFIG_MACH_SONY_POPLAR_KDDI
  ARCH: arm64
  OUT: out
  ART: artifacts

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout (submodules required - drivers/kernelsu is a symlink into the KernelSU submodule)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive
          fetch-depth: 1

      - name: Preflight - fail early if poplar_kddi support is absent or miswired
        shell: bash
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          mkdir -p "$ART"
          fail() { echo "::error title=poplar_kddi preflight::$*"; exit 1; }

          DEF="arch/arm64/configs/${DEFCONFIG}"
          DTS="arch/arm64/boot/dts/qcom/${DTB_NAME}.dts"
          DTMK="arch/arm64/boot/dts/qcom/Makefile"

          [ -f "$DEF" ] || fail "Missing defconfig: $DEF"
          [ -f "$DTS" ] || fail "Missing DTS: $DTS"
          grep -q "^${DTB_MACH_SYMBOL}=y" "$DEF" || fail "$DEF does not set ${DTB_MACH_SYMBOL}=y"
          grep -F "dtb-\$(${DTB_MACH_SYMBOL})" "$DTMK" | grep -Fq "${DTB_NAME}.dtb" \
            || fail "$DTMK does not map ${DTB_MACH_SYMBOL} -> ${DTB_NAME}.dtb"
          grep -Fq 'compatible = "somc,poplar-kddi"' "$DTS" || fail "$DTS is not a somc,poplar-kddi DTS"
          # Kconfig sources that must resolve even when the feature is off (a dangling one breaks 'make *_defconfig')
          for k in drivers/kernelsu/Kconfig security/baseband-guard/Kconfig fs/nomount/Kconfig; do
            [ -f "$k" ] || fail "$k unresolved (KernelSU submodule not checked out, or symlink/dir missing)"
          done

          {
            echo "### Preflight"
            echo "- branch: \`${BRANCH}\` @ \`$(git rev-parse --short HEAD)\`"
            echo "- defconfig \`${DEFCONFIG}\`, dts \`${DTB_NAME}.dts\`, mapped by \`${DTB_MACH_SYMBOL}\`: OK"
            grep -q '^CONFIG_KSU=y' "$DEF" && echo "- KSU lines in committed defconfig: present" \
              || echo "- KSU lines in committed defconfig: **absent** (Kconfig default would resolve KSU=y + TRACEPOINT hook, unsupported on 4.4)"
            { grep -Eq '^CONFIG_LITTLE_CPU_MASK=[0-9]+' "$DEF" && grep -Eq '^CONFIG_BIG_CPU_MASK=[0-9]+' "$DEF"; } \
              && echo "- CPU masks in committed defconfig: present" \
              || echo "- CPU masks in committed defconfig: **absent** (CI sets 15/240)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev cpio lz4 xz-utils curl ca-certificates python3 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Fetch AOSP Clang 20 and verify version
        shell: bash
        env:
          CLANG_URL: ${{ inputs.clang_url }}
          CLANG_REV: ${{ inputs.clang_rev }}
        run: |
          set -euo pipefail
          base=https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads
          cands=()
          [ -n "${CLANG_URL:-}" ] && cands+=("$CLANG_URL")
          # main-kernel is the branch Google's kernel superproject tracks for prebuilts/clang.
          # Whether it (or main-kernel-build-2024) carries $CLANG_REV is probed, not assumed.
          for b in main-kernel main-kernel-build-2024; do cands+=("$base/$b/clang-${CLANG_REV}.tar.gz"); done

          dest="$HOME/clang"; ok=0
          for u in "${cands[@]}"; do
            rm -rf "$dest"; mkdir -p "$dest"
            code="$(curl -sSL --retry 4 --retry-all-errors --retry-delay 5 \
                      -o /tmp/clang.tar.gz -w '%{http_code}' "$u" || true)"
            echo "probe: HTTP ${code} ${u}"
            [ "$code" = "200" ] || continue
            tar -xzf /tmp/clang.tar.gz -C "$dest" --no-same-owner || { echo "::warning::tar failed for $u"; continue; }
            rm -f /tmp/clang.tar.gz
            CLANG_BIN="$(find "$dest" -maxdepth 3 -type f -path '*/bin/clang' | head -n1)"
            [ -n "$CLANG_BIN" ] || { echo "::warning::no bin/clang in tarball from $u"; continue; }
            VER="$("$CLANG_BIN" --version | head -n1)"; echo "$VER"
            if echo "$VER" | grep -Eq 'clang version 20\.'; then ok=1; break; fi
            echo "::warning::not Clang 20.x: $VER"
          done
          [ "$ok" = 1 ] || { echo "::error title=clang::No usable Clang 20.x from any candidate (see 'probe:' lines). Pass a working tarball via the clang_url input."; exit 1; }
          echo "$(dirname "$CLANG_BIN")" >> "$GITHUB_PATH"
          echo "CLANG_VERSION=$VER" >> "$GITHUB_ENV"

      - name: Configure (poplar_kddi_defconfig)
        shell: bash
        env:
          ENABLE_KSU: ${{ inputs.enable_ksu }}
        run: |
          set -euo pipefail
          export KBUILD_BUILD_USER=ci KBUILD_BUILD_HOST=github-actions
          # No spaces in any value, so plain word-splitting of $MAKE_ARGS is safe.
          MAKE_ARGS="O=$OUT ARCH=arm64 SUBARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          echo "MAKE_ARGS=$MAKE_ARGS" >> "$GITHUB_ENV"

          make $MAKE_ARGS "$DEFCONFIG" 2>&1 | tee "$ART/build.log"
          C="scripts/config --file $OUT/.config"

          # poplar_kddi_defconfig leaves LITTLE/BIG_CPU_MASK empty -> invalid values -> Kconfig prompts -> non-interactive make dies.
          # msm8998 is 4+4; sibling poplar defconfig uses 15 / 240.
          if ! grep -Eq '^CONFIG_LITTLE_CPU_MASK=[0-9]+' "$OUT/.config" || ! grep -Eq '^CONFIG_BIG_CPU_MASK=[0-9]+' "$OUT/.config"; then
            echo "::warning title=defconfig::CPU masks missing in ${DEFCONFIG}; setting LITTLE=15 BIG=240 for this build"
            $C --set-val LITTLE_CPU_MASK 15 --set-val BIG_CPU_MASK 240
          fi

          if [ "$ENABLE_KSU" = "true" ]; then
            # Same symbol set poplar_defconfig carries. Inline-hook SUSFS: the tree has the hooks in fs/ and kernel/;
            # ReSukiSU's default (tracepoint) hook is documented as GKI2 (5.10+) only.
            $C -e KSU -d KSU_TRACEPOINT_HOOK -d KSU_MANUAL_HOOK -e KSU_SUSFS \
               -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT -e KSU_SUSFS_SUS_KSTAT -e KSU_SUSFS_SPOOF_UNAME \
               -e KSU_SUSFS_ENABLE_LOG -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
               -e KSU_SUSFS_OPEN_REDIRECT -e KSU_SUSFS_SUS_MAP -e NOMOUNT -e BBG -e REKERNEL
          fi

          # Resolve non-interactively, then prove no prompt remains.
          make $MAKE_ARGS olddefconfig 2>&1 | tee -a "$ART/build.log"
          make $MAKE_ARGS silentoldconfig </dev/null 2>&1 | tee -a "$ART/build.log"

          grep -q "^${DTB_MACH_SYMBOL}=y" "$OUT/.config" || { echo "::error::${DTB_MACH_SYMBOL}=y missing in generated .config"; exit 1; }
          if [ "$ENABLE_KSU" = "true" ]; then
            for s in CONFIG_KSU CONFIG_KSU_SUSFS CONFIG_NOMOUNT CONFIG_BBG CONFIG_REKERNEL; do
              grep -q "^${s}=y" "$OUT/.config" || { echo "::error title=KSU block::${s}=y did not survive olddefconfig (missing Kconfig dependency)"; exit 1; }
            done
            grep -q '^CONFIG_KSU_TRACEPOINT_HOOK=y' "$OUT/.config" && { echo "::error title=KSU hook::tracepoint hook still selected"; exit 1; }
          fi

          cp "$OUT/.config" "$ART/config.txt"
          cp "arch/arm64/configs/${DEFCONFIG}" "$ART/${DEFCONFIG}"
          {
            echo "### Resolved config (clang: \`$CLANG_VERSION\`)"
            echo '```'
            grep -E '^CONFIG_(KSU|KSU_TRACEPOINT_HOOK|KSU_MANUAL_HOOK|KSU_SUSFS|NOMOUNT|BBG|REKERNEL|LITTLE_CPU_MASK|BIG_CPU_MASK|MACH_SONY_POPLAR_KDDI)=' "$OUT/.config" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Image.gz and the single poplar_kddi DTB
        shell: bash
        run: |
          set -euo pipefail
          export KBUILD_BUILD_USER=ci KBUILD_BUILD_HOST=github-actions
          # UNVERIFIED pre-emptive downgrade: Clang 16+ made these hard errors; this 4.4 tree predates that.
          # If the log shows they are unnecessary, remove them.
          KCF="-Wno-error=int-conversion -Wno-error=incompatible-function-pointer-types -Wno-error=incompatible-pointer-types-discards-qualifiers"

          make -j"$(nproc)" $MAKE_ARGS KCFLAGS="$KCF" Image.gz 2>&1 | tee -a "$ART/build.log"
          # Explicit single DTB target (matches CONFIG_MACH_SONY_POPLAR_KDDI; no other DTBs are produced).
          make -j"$(nproc)" $MAKE_ARGS "qcom/${DTB_NAME}.dtb" 2>&1 | tee -a "$ART/build.log"

          BOOT="$OUT/arch/arm64/boot"
          test -s "$BOOT/Image.gz"
          test -s "$BOOT/dts/qcom/${DTB_NAME}.dtb"
          n="$(find -L "$BOOT/dts" -name '*.dtb' | wc -l)"
          [ "$n" = 1 ] || { echo "::error::expected exactly 1 DTB in $BOOT/dts, found $n"; exit 1; }

          # Same operation as arch/arm64/boot/Makefile's Image.gz-dtb rule: Image.gz followed by the DTB(s).
          cat "$BOOT/Image.gz" "$BOOT/dts/qcom/${DTB_NAME}.dtb" > "$ART/Image.gz-dtb"
          cp "$BOOT/Image.gz" "$ART/Image.gz"
          cp "$BOOT/dts/qcom/${DTB_NAME}.dtb" "$ART/${DTB_NAME}.dtb"
          sha256sum "$ART/Image.gz" "$ART/Image.gz-dtb" "$ART/${DTB_NAME}.dtb" | tee "$ART/SHA256SUMS"

      - name: Record boot.img status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ART"
          cat > "$ART/BOOT_IMG_NOT_BUILT.txt" <<'EOF'
          boot.img was NOT created. It cannot be built safely from this repo alone.
          Missing inputs (none are in the kernel repo):
            1. A ramdisk from a known-good SOV36 / poplar_kddi boot.img (stock, or the ROM you flash).
            2. That image's header parameters (header version, base/kernel/ramdisk/tags offsets, page size,
               cmdline, os_version/patch_level) - read them from the working boot.img you unpack.
            3. Any signing/AVB handling the target ROM/bootloader state requires.
          Use the uploaded Image.gz-dtb (kernel + exactly one DTB appended) to repack that boot.img, or flash it
          through your AnyKernel3 package, which repacks the device's own boot.img on-device.
          EOF

      - name: Summarize errors on failure
        if: failure()
        shell: bash
        run: |
          grep -nE 'error:|Error [0-9]+|\*\*\* ' "$ART/build.log" 2>/dev/null | head -50 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poplar_kddi-kernel-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
